# Pipeline jobs. Every task runs src/run.py with one command.
# All jobs share one single-node cluster definition (the &pipeline_cluster anchor in the first job).
#
#   builder service principal : build, reassess, discover   (talks to JFrog; no write to the wheelhouse)
#   promoter service principal: promote, publish, switch, rollback, revoke, cleanup
#                               (writes the wheelhouse, compute policies and serverless base environments)

resources:
  jobs:
    libdist_build:
      name: libdist-build
      description: Resolve, scan, test and stage a candidate release for one channel.
      run_as:
        service_principal_name: ${var.builder_sp}
      max_concurrent_runs: 1
      permissions:
        # libdist-reassess (run by the builder) starts replacement builds with this job
        - level: CAN_MANAGE_RUN
          service_principal_name: ${var.builder_sp}
      parameters:
        - name: channel
          default: ds-basics
        - name: upgrade_package
          default: ""
      email_notifications:
        on_failure: ["${var.notification_email}"]
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: &pipeline_cluster
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
              application: library-distribution
      tasks:
        - task_key: build
          job_cluster_key: pipeline
          timeout_seconds: 7200
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - build
              - --channel
              - "{{job.parameters.channel}}"
              - --upgrade-package
              - "{{job.parameters.upgrade_package}}"

    libdist_reassess:
      name: libdist-reassess
      description: Rescan releases in use, open grace periods for new findings, start replacement builds.
      run_as:
        service_principal_name: ${var.builder_sp}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 0/4 * * ?"   # every 4 hours (pilot interval)
        timezone_id: UTC
        pause_status: PAUSED                      # unpause in deployment step 11
      email_notifications:
        on_failure: ["${var.notification_email}"]
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: *pipeline_cluster
      tasks:
        - task_key: reassess
          job_cluster_key: pipeline
          timeout_seconds: 7200
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - reassess
              - --build-job-id
              - ${resources.jobs.libdist_build.id}

    libdist_discover:
      name: libdist-discover
      description: Snapshot of the libraries that jobs, clusters and policies use in this workspace.
      run_as:
        service_principal_name: ${var.builder_sp}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 5 * * ?"    # daily 05:30 UTC
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: notebook_root
          default: ""
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: *pipeline_cluster
      tasks:
        - task_key: discover
          job_cluster_key: pipeline
          timeout_seconds: 7200
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - discover
              - --notebook-root
              - "{{job.parameters.notebook_root}}"

    libdist_publish:
      name: libdist-publish
      description: Copy an APPROVED release to the wheelhouse and verify every hash.
      run_as:
        service_principal_name: ${var.promoter_sp}
      max_concurrent_runs: 1
      parameters:
        - name: release_id
          default: ""
      email_notifications:
        on_failure: ["${var.notification_email}"]
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: *pipeline_cluster
      tasks:
        - task_key: publish
          job_cluster_key: pipeline
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - publish
              - --release-id
              - "{{job.parameters.release_id}}"

    libdist_switch:
      name: libdist-switch
      description: Point one wave of compute policies at a published release.
      run_as:
        service_principal_name: ${var.promoter_sp}
      max_concurrent_runs: 1
      parameters:
        - name: release_id
          default: ""
        - name: wave
          default: canary
      email_notifications:
        on_failure: ["${var.notification_email}"]
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: *pipeline_cluster
      tasks:
        - task_key: switch
          job_cluster_key: pipeline
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - switch
              - --release-id
              - "{{job.parameters.release_id}}"
              - --wave
              - "{{job.parameters.wave}}"

    libdist_rollback:
      name: libdist-rollback
      description: Point one wave back at the release it used before, if that release is still eligible.
      run_as:
        service_principal_name: ${var.promoter_sp}
      max_concurrent_runs: 1
      parameters:
        - name: channel
          default: ds-basics
        - name: wave
          default: canary
      email_notifications:
        on_failure: ["${var.notification_email}"]
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: *pipeline_cluster
      tasks:
        - task_key: rollback
          job_cluster_key: pipeline
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - rollback
              - --channel
              - "{{job.parameters.channel}}"
              - --wave
              - "{{job.parameters.wave}}"

    libdist_revoke:
      name: libdist-revoke
      description: Mark a release REVOKED and list the compute that still points at it.
      run_as:
        service_principal_name: ${var.promoter_sp}
      max_concurrent_runs: 1
      parameters:
        - name: release_id
          default: ""
        - name: reason
          default: ""
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: *pipeline_cluster
      tasks:
        - task_key: revoke
          job_cluster_key: pipeline
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - revoke
              - --release-id
              - "{{job.parameters.release_id}}"
              - --reason
              - "{{job.parameters.reason}}"

    libdist_promote:
      name: libdist-promote
      description: >-
        Zero-touch promotion. Approves by the rules when policy.yml allows it, publishes approved
        releases, starts rollouts and moves them wave by wave with a health check.
      run_as:
        service_principal_name: ${var.promoter_sp}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"  # every 30 minutes
        timezone_id: UTC
        pause_status: PAUSED                      # unpause when phase 2 starts
      email_notifications:
        on_failure: ["${var.notification_email}"]
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: *pipeline_cluster
      tasks:
        - task_key: promote
          job_cluster_key: pipeline
          timeout_seconds: 3600
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - promote

    libdist_cleanup:
      name: libdist-cleanup
      description: Delete old candidates and unused releases by the retention rules. Reports only unless apply=true.
      run_as:
        service_principal_name: ${var.promoter_sp}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 ? * SUN"   # weekly
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: apply
          default: "false"
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: *pipeline_cluster
      tasks:
        - task_key: cleanup
          job_cluster_key: pipeline
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - cleanup
              - --apply
              - "{{job.parameters.apply}}"

    # ---- One-off commands -------------------------------------------------------------
    # Run any command of src/run.py as the builder or as the promoter, for example:
    #   databricks bundle run -t prod libdist_run_promoter --params 'command=status --channel ds-basics'
    # Do not put a comma in the command when you use --params; use the job UI
    # ("Run now with different parameters") for those.

    libdist_run_builder:
      name: libdist-run-builder
      description: >-
        Run one pipeline command as the builder: waiver, migration-report, build --full-upgrade,
        status, verify, init-registry.
      run_as:
        service_principal_name: ${var.builder_sp}
      parameters:
        - name: command
          default: status
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: *pipeline_cluster
      tasks:
        - task_key: run
          job_cluster_key: pipeline
          timeout_seconds: 7200
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - --command-line
              - "{{job.parameters.command}}"

    libdist_run_promoter:
      name: libdist-run-promoter
      description: >-
        Run one pipeline command as the promoter: serverless-init, rollout-start, import-release,
        status, verify.
      run_as:
        service_principal_name: ${var.promoter_sp}
      parameters:
        - name: command
          default: status
      job_clusters:
        - job_cluster_key: pipeline
          new_cluster: *pipeline_cluster
      tasks:
        - task_key: run
          job_cluster_key: pipeline
          timeout_seconds: 7200
          spark_python_task:
            python_file: ../src/run.py
            parameters:
              - --config-dir
              - ${workspace.file_path}/${var.config_dir}
              - --command-line
              - "{{job.parameters.command}}"
